version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true

services:
  db:
    image: postgres:15-alpine
    container_name: db_app
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: StrongPassword123!
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_tool
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: StrongPassword123!
      PGADMIN_LISTEN_PORT: 80
    networks:
      - backend-net
      - frontend-net

  web:
    build: ./app
    container_name: web_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: StrongPassword123!
      DB_NAME: appdb
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - web
      - pgadmin
